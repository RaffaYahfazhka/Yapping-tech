<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 64" fill="none" className="h-7 w-auto">
  <defs>
    <linearGradient id="flowGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
  </defs>
  
  <!-- Icon Mark: Modern dynamic speech flow + tech node -->
  <g transform="translate(4, 8)">
    <!-- Base geometric rounded square with gradient -->
    <rect x="0" y="0" width="48" height="48" rx="14" fill="#0C0F14" />
    <!-- Dynamic curved flow line (Y/Flow fusion) -->
    <path d="M14 16 C20 16, 24 20, 24 25 L24 36" stroke="url(#flowGradient)" stroke-width="4" stroke-linecap="round" />
    <path d="M34 16 C28 16, 24 20, 24 25" stroke="#38bdf8" stroke-width="4" stroke-linecap="round" />
    <!-- Pulse spark node -->
    <circle cx="34" cy="16" r="3" fill="#10b981" />
  </g>

  <!-- Wordmark -->
  <text x="64" y="38" font-family="Plus Jakarta Sans, sans-serif" font-weight="800" font-size="22" letter-spacing="-0.03em" fill="#0f172a">
    yapping<tspan font-weight="400" fill="#64748b">techflow</tspan><tspan fill="#10b981">.</tspan>
  </text>
</svg>

