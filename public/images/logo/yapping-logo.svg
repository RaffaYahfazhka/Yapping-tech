<svg width="400" height="64" viewBox="0 0 200 32" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Icon container: rounded-full black circle exactly as YappingLogo.tsx -->
  <circle cx="16" cy="16" r="16" fill="#000000"/>
  
  <!-- Outer glowing technical ring with aperture break -->
  <circle
    cx="16"
    cy="16"
    r="10"
    stroke="url(#yappingRingGradFull)"
    stroke-width="3"
    stroke-linecap="round"
    stroke-dasharray="46 14"
    transform="rotate(-45 16 16)"
  />
  
  <!-- Inner solid tech dot -->
  <circle cx="16" cy="16" r="3.5" fill="#38BDF8"/>
  
  <defs>
    <linearGradient id="yappingRingGradFull" x1="6" y1="6" x2="26" y2="26" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>
  </defs>

  <!-- Styled Modern Typography exactly as YappingLogo.tsx -->
  <g transform="translate(42, 21)">
    <text font-family="'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" letter-spacing="-0.3">
      <tspan font-weight="900" fill="#0C0A09">yapping</tspan>
      <tspan font-weight="400" fill="#78716C">techflow</tspan>
      <tspan font-weight="800" fill="#10B981">.</tspan>
    </text>
  </g>
</svg>
